services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8501"
    command:
      - streamlit
      - run
      - ./webui/Main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.enableCORS=false
      - --server.enableXsrfProtection=false
      - --browser.gatherUsageStats=false
    restart: always
    labels:
      - "coolify.managed=true"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    command:
      - python3
      - main.py
    restart: always
    labels:
      - "coolify.managed=true"
